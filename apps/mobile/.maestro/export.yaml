appId: me.rxresu
name: Export resume PDF on device
---
# Signed in, unlocked disposable RESUME_ID. SHARE_SHEET_TEXT matches localized OS share UI.
- launchApp
- openLink: me.rxresu://builder/${RESUME_ID}/share
- extendedWaitUntil:
    visible: Download
    timeout: 30000
- tapOn: Download
- scrollUntilVisible:
    element: Download PDF
    direction: DOWN
- tapOn: Download PDF
- extendedWaitUntil:
    visible: ${SHARE_SHEET_TEXT}
    timeout: 60000
