appId: me.rxresu
name: Edit private resume notes and save
---
# Signed in, unlocked disposable RESUME_ID with empty notes. Exercises real shared draft owner through private notes.
- launchApp
- openLink: me.rxresu://builder/${RESUME_ID}/share
- extendedWaitUntil:
    visible: Document options
    timeout: 30000
- tapOn: Document options
- tapOn: Notes
- tapOn:
    text: Notes
    index: 1
- inputText: Store readiness saved note
- hideKeyboard
# Draft marker is outside editor; tapping blurs rich text before dismissal.
- tapOn: Draft · not printed
- swipe:
    start: 50%, 52%
    end: 50%, 95%
- tapOn: Close
- extendedWaitUntil:
    visible: Saved
    timeout: 30000
# Reopen after process restart; unsaved local drafts no longer satisfy the Saved check above.
- stopApp
- launchApp
- openLink: me.rxresu://builder/${RESUME_ID}/share
- tapOn: Document options
- tapOn: Notes
- assertVisible: .*Store readiness saved note.*
