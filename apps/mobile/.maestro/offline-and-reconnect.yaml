appId: me.rxresu
name: Queue notes offline and sync on reconnect
onFlowComplete:
  - setAirplaneMode: disabled
---
# Android only: Maestro setAirplaneMode support. Wi-Fi must turn off with airplane mode.
# Signed in, dedicated unlocked RESUME_ID. Warm draft and fonts while online first.
- launchApp
- openLink: me.rxresu://builder/${RESUME_ID}/share
- extendedWaitUntil:
    visible: Document options
    timeout: 30000
- tapOn: Document options
- tapOn: Notes
- setAirplaneMode: enabled
- tapOn:
    text: Notes
    index: 1
- inputText: Store readiness offline note
- hideKeyboard
- tapOn: Draft · not printed
- swipe:
    start: 50%, 52%
    end: 50%, 95%
- tapOn: Close
- extendedWaitUntil:
    visible: Offline · saved on this device
    timeout: 30000
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: Saved
    timeout: 60000
- stopApp
- launchApp
- openLink: me.rxresu://builder/${RESUME_ID}/share
- tapOn: Document options
- tapOn: Notes
- assertVisible: .*Store readiness offline note.*
