appId: me.rxresu
name: Sign in through browser
---
# Start signed out. Dedicated test server/account, English UI, email auth, no 2FA.
- launchApp
- tapOn: Another server
- tapOn: Continue
- tapOn: Server address
- eraseText: 200
- inputText: ${SERVER_ORIGIN}
- hideKeyboard
- extendedWaitUntil:
    visible:
      text: Continue
      enabled: true
    timeout: 30000
- tapOn: Continue
- tapOn: Continue in browser
- tapOn:
    text: Continue
    optional: true
- extendedWaitUntil:
    visible: Email Address
    timeout: 30000
- tapOn: Email Address
- inputText: ${EMAIL}
- tapOn: Password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: Sign in
- extendedWaitUntil:
    visible: Allow access|Documents
    timeout: 30000
- tapOn:
    text: Allow access
    optional: true
- extendedWaitUntil:
    visible: Documents
    timeout: 60000
