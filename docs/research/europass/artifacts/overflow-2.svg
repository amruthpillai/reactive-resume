<text font-family="sans-serif" x="180.00" y="254.20" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">editorial review date.</text>
<text font-family="sans-serif" x="180.00" y="272.90" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">Documented ambiguous wording without guessing the</text>
<text font-family="sans-serif" x="180.00" y="287.60" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">provider’s intent. Workshop participants tested revised</text>
<text font-family="sans-serif" x="180.00" y="302.30" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">navigation labels and contributed examples of questions</text>
<text font-family="sans-serif" x="180.00" y="317.00" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">that the directory should answer.</text>
<text font-family="sans-serif" x="180.00" y="335.70" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">Prepared a maintenance guide so future editors can update</text>
<text font-family="sans-serif" x="180.00" y="350.40" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">links, preserve context and flag missing evidence. The guide</text>
<text font-family="sans-serif" x="180.00" y="365.10" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">separates direct source statements from editorial</text>
