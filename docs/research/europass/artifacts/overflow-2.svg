<text font-family="sans-serif" x="180.00" y="191.40" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">Mapped public learning resources.</text>
<text font-family="sans-serif" x="180.00" y="210.10" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">Reviewed regional catalogues with volunteers, comparing the</text>
<text font-family="sans-serif" x="180.00" y="224.80" font-size="10.5" fill="#20262b" font-weight="400" data-source="sections.projects.items[0].description">clarity of eligibility, learning outcomes and application</text>
